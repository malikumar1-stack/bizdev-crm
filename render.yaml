services:
  # 1. Backend Web Service (Free Tier - 0 Card Required)
  - type: web
    name: bizdev-crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_5ImnqwasPob6@ep-cool-darkness-ax6wd8g6.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Karachi

  # 2. Frontend Web Application (Free Tier - 0 Card Required)
  - type: web
    name: bizdev-crm-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bizdev-crm-backend
          property: host
