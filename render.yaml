services:
  - type: web
    name: bizdev-crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: bizdev-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Karachi

  - type: web
    name: bizdev-crm-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bizdev-crm-backend
          property: host

databases:
  - name: bizdev-crm-db
    plan: free
    databaseName: bizdevcrm
    user: crm_admin
