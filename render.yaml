services:
  # 1. Backend Web Service (Free Tier)
  - type: web
    name: jsil-bd-crm-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_5ImnqwasPob6@ep-cool-darkness-ax6wd8g6.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Karachi
      - key: WHATSAPP_API_URL
        value: https://graph.facebook.com/v19.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false

  # 2. Frontend Web Application (Static Site)
  - type: web
    name: jsil-bd-crm-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jsil-bd-crm-backend
          property: host
